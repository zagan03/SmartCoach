name: SmartCoach CI/CD

on:
  push:
    branches: [main, develop, 'feature/', 'fix/', 'bugfix/**']
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend - Install, Lint, Build
    runs-on: ubuntu-latest

    steps:
      
name: Checkout repository
      uses: actions/checkout@v4

      
name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

      
name: Install frontend dependencies
      run: npm install

      
name: Lint frontend
      run: npm run lint
      continue-on-error: true

      
name: Create .env for build
      run: echo "VITE_API_BASE_URL=http://localhost:3001/api" > .env

      
name: Build frontend
      run: npm run build

  backend:
    name: Backend - Install, Build, Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      
name: Checkout repository
      uses: actions/checkout@v4

      
name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

      
name: Install backend dependencies
      run: npm install

      
name: Build backend
      run: npm run build

      
name: Run backend tests
      run: npm test
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: smartcoach_test
        DB_USER: smartcoach
        DB_PASSWORD: smartcoach

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: always()

    steps:
      
name: Report status
      run: |
        echo "Frontend: ${{ needs.frontend.result }}"
        echo "Backend: ${{ needs.backend.result }}"

          if [[ "${{ needs.frontend.result }}" == "success" && "${{ needs.backend.result }}" == "success" ]]; then
            echo "All checks passed."
          else
            echo "Some checks failed. See individual jobs for details."
            exit 1
          fi